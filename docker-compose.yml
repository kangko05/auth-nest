# test-only setup — data wiped on every `down`+`up`.
# run: docker compose --env-file .env.test up

services:
  auth_nest_mysql:
    image: mysql:lts
    container_name: mysql_test
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASS}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASS}
    ports:
      - ${DB_PORT}:3306
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth_nest_redis:
    image: redis:7-alpine
    container_name: redis_test
    ports:
      - ${REDIS_PORT}:6379
    restart: always
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

